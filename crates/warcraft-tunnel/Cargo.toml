[package]
name = "warcraft-tunnel"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WebSocket<->TCP bridge fronting vmangos realmd/mangosd, gated by per-member keys"

[lints]
workspace = true

[[bin]]
name = "bridge"
path = "src/bridge.rs"

[dependencies]
anyhow.workspace = true
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "net", "io-util"] }
tokio-tungstenite = "0.21"
