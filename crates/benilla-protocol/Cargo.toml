[package]
name = "benilla-protocol"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WoW 1.12.1 auth (SRP6) + world wire protocol and the benilla-auth CLI"

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
clap.workspace = true
benilla-srp = { path = "../benilla-srp" }
flate2 = "1.0"
# The logon's draw among a realmlist's addresses.
rand = "0.8.6"
sha1.workspace = true
# Derives `SessionEventKind`, `SessionEvent`'s fieldless twin that the handler table keys on.
strum = { version = "0.26", features = ["derive"] }
# Optional `wss` tunnel transport (src/transport.rs): sync WebSocket client over rustls, so the
# client/bots can reach a server exposed only through our 443 bridge. rustls roots = no OpenSSL.
tungstenite = { version = "0.21", features = ["rustls-tls-webpki-roots"] }

# The logon challenge's time-zone bias on unix, `localtime_r`'s.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# The SRP probe example re-derives the handshake by hand, to vary what `benilla-srp` fixes.
num-bigint = "0.4.6"
